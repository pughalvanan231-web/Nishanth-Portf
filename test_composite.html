<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Step Frames Generator Test</title>
  <style>
    body { background: #111; color: #fff; font-family: sans-serif; display: flex; gap: 20px; padding: 20px; }
    canvas { border: 1px solid #444; max-height: 90vh; }
  </style>
</head>
<body>
  <div>
    <h3>Step 01 - CapCut Timeline</h3>
    <canvas id="c1" width="786" height="1272"></canvas>
  </div>
  <div>
    <h3>Step 02 - Instagram ft_nixaa</h3>
    <canvas id="c2" width="774" height="1130"></canvas>
  </div>

  <script>
    // Draw Step 01 (CapCut)
    const img1 = new Image();
    img1.src = '/step01_ref.jpg';
    img1.onload = () => {
      const c1 = document.getElementById('c1');
      const ctx = c1.getContext('2d');
      // Draw base image 2x resolution
      ctx.drawImage(img1, 0, 0, 786, 1272);

      // Coordinates at 2x:
      // Screen width: 400 to fully cover NVDA 35% on the left, height: 850
      // Angle: 13.7 deg
      ctx.save();
      ctx.translate(442, 604);
      ctx.rotate(13.7 * Math.PI / 180);

      // Phone screen clip
      const sw = 400;
      const sh = 850;
      const r = 44;
      ctx.beginPath();
      ctx.roundRect(-sw/2, -sh/2, sw, sh, r);
      ctx.fillStyle = '#0c0d10';
      ctx.fill();
      ctx.clip();

      // CapCut UI inside phone screen
      // 1. Status Bar
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 20px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto';
      ctx.fillText('9:41', -sw/2 + 28, -sh/2 + 36);

      // Dynamic Island
      ctx.beginPath();
      ctx.roundRect(-42, -sh/2 + 16, 84, 26, 13);
      ctx.fillStyle = '#000000';
      ctx.fill();

      // Top action bar
      ctx.fillStyle = '#1e1f24';
      ctx.beginPath();
      ctx.roundRect(sw/2 - 90, -sh/2 + 20, 72, 28, 6);
      ctx.fill();
      ctx.fillStyle = '#00f2fe';
      ctx.font = 'bold 13px sans-serif';
      ctx.fillText('4K 60', sw/2 - 82, -sh/2 + 38);

      // 2. Video Player Preview
      const vh = 320;
      const vy = -sh/2 + 56;
      ctx.fillStyle = '#14151a';
      ctx.fillRect(-sw/2, vy, sw, vh);

      // Simulated cinematic video frame in preview
      const grad = ctx.createLinearGradient(-sw/2, vy, sw/2, vy + vh);
      grad.addColorStop(0, '#1a1829');
      grad.addColorStop(0.5, '#2e1c36');
      grad.addColorStop(1, '#0e1724');
      ctx.fillStyle = grad;
      ctx.fillRect(-sw/2, vy, sw, vh);

      // Video preview elements
      ctx.strokeStyle = 'rgba(255,255,255,0.15)';
      ctx.lineWidth = 1;
      ctx.strokeRect(-sw/2 + 20, vy + 20, sw - 40, vh - 40);

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 22px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('NISHANTH FILMS', 0, vy + vh/2 - 10);
      ctx.font = '14px sans-serif';
      ctx.fillStyle = '#00f2fe';
      ctx.fillText('● REC  00:03:18 / 00:15:00', 0, vy + vh/2 + 18);

      // Play icon in center
      ctx.beginPath();
      ctx.arc(0, vy + vh/2 - 40, 24, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(-6, vy + vh/2 - 50);
      ctx.lineTo(10, vy + vh/2 - 40);
      ctx.lineTo(-6, vy + vh/2 - 30);
      ctx.fillStyle = '#ffffff';
      ctx.fill();

      // 3. Timecode & Controls bar
      const cy = vy + vh;
      ctx.fillStyle = '#101116';
      ctx.fillRect(-sw/2, cy, sw, 44);

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 16px monospace';
      ctx.textAlign = 'left';
      ctx.fillText('00:00:03:18', -sw/2 + 20, cy + 28);

      ctx.fillStyle = '#8e92a0';
      ctx.font = '14px sans-serif';
      ctx.textAlign = 'right';
      ctx.fillText('↺   ↻   ⛶', sw/2 - 20, cy + 28);

      // 4. CapCut Multi-Track Timeline
      const ty = cy + 44;
      ctx.fillStyle = '#181920';
      ctx.fillRect(-sw/2, ty, sw, 280);

      // Ruler / seconds ticks
      ctx.fillStyle = '#444856';
      for (let x = -sw/2; x < sw/2; x += 30) {
        ctx.fillRect(x, ty + 2, 2, 8);
      }

      // Track 1: Main Video Clips
      const t1y = ty + 18;
      ctx.fillStyle = '#2b3248';
      ctx.beginPath();
      ctx.roundRect(-sw/2 + 10, t1y, 110, 52, 6);
      ctx.fill();
      ctx.strokeStyle = '#3b82f6';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 12px sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText('Clip 01 (Hook)', -sw/2 + 18, t1y + 30);

      ctx.fillStyle = '#3a2b48';
      ctx.beginPath();
      ctx.roundRect(-sw/2 + 125, t1y, 130, 52, 6);
      ctx.fill();
      ctx.strokeStyle = '#ec4899';
      ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.fillText('Clip 02 (Action)', -sw/2 + 133, t1y + 30);

      ctx.fillStyle = '#2b4438';
      ctx.beginPath();
      ctx.roundRect(-sw/2 + 260, t1y, 120, 52, 6);
      ctx.fill();
      ctx.strokeStyle = '#10b981';
      ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.fillText('Clip 03 (B-Roll)', -sw/2 + 268, t1y + 30);

      // Track 2: Audio Waveform
      const t2y = t1y + 60;
      ctx.fillStyle = '#122e26';
      ctx.beginPath();
      ctx.roundRect(-sw/2 + 10, t2y, sw - 20, 42, 6);
      ctx.fill();
      ctx.strokeStyle = '#059669';
      ctx.stroke();

      // Audio waveform bars
      ctx.fillStyle = '#34d399';
      for (let x = -sw/2 + 20; x < sw/2 - 20; x += 6) {
        const h = Math.sin(x * 0.1) * 12 + 14;
        ctx.fillRect(x, t2y + 21 - h/2, 3, h);
      }
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 11px sans-serif';
      ctx.fillText('🎵 Beat Drop_Master_Mix.wav', -sw/2 + 18, t2y + 14);

      // Track 3: Captions / Text
      const t3y = t2y + 50;
      ctx.fillStyle = '#3a321a';
      ctx.beginPath();
      ctx.roundRect(-sw/2 + 30, t3y, 160, 36, 6);
      ctx.fill();
      ctx.strokeStyle = '#f59e0b';
      ctx.stroke();
      ctx.fillStyle = '#fbbf24';
      ctx.font = 'bold 11px sans-serif';
      ctx.fillText('💬 Dynamic Auto-Captions', -sw/2 + 38, t3y + 22);

      // Playhead vertical line (White with Yellow Scrubber)
      const px = 0; // Center playhead
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(px - 1, ty, 2, 210);
      ctx.beginPath();
      ctx.moveTo(px - 7, ty);
      ctx.lineTo(px + 7, ty);
      ctx.lineTo(px, ty + 12);
      ctx.fillStyle = '#facc15';
      ctx.fill();

      // 5. CapCut Bottom Toolbar
      const by = sh/2 - 76;
      ctx.fillStyle = '#0e0f14';
      ctx.fillRect(-sw/2, by, sw, 76);

      const tools = ['✂ Edit', '🎵 Audio', '🔤 Text', '✨ Effects', '🎨 Filters'];
      ctx.font = 'bold 12px sans-serif';
      ctx.fillStyle = '#d1d5db';
      ctx.textAlign = 'center';
      tools.forEach((t, i) => {
        const tx = -sw/2 + (sw / 5) * (i + 0.5);
        ctx.fillText(t, tx, by + 44);
      });

      ctx.restore();

      // DRAW FLOATING FROSTED GLASS CARDS (Replacing AAPL, AMZN, PLTR)
      function drawGlassCard(x, y, w, h, category, icon, title, subtitle, stat1Label, stat1Val, stat2Label, stat2Val) {
        ctx.save();
        // Glass background with subtle border
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, 24);
        const cardGrad = ctx.createLinearGradient(x, y, x, y + h);
        cardGrad.addColorStop(0, 'rgba(22, 24, 32, 0.96)');
        cardGrad.addColorStop(1, 'rgba(12, 14, 18, 0.98)');
        ctx.fillStyle = cardGrad;
        ctx.fill();
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.16)';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // Inner glowing border effect
        ctx.beginPath();
        ctx.roundRect(x + 2, y + 2, w - 4, h - 4, 22);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
        ctx.stroke();

        // Category Tag
        ctx.fillStyle = '#60a5fa';
        ctx.font = 'bold 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto';
        ctx.fillText(category.toUpperCase(), x + 24, y + 36);

        // Main Title
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 22px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto';
        ctx.fillText(icon + '  ' + title, x + 24, y + 74);

        // Subtitle
        ctx.fillStyle = '#9ca3af';
        ctx.font = '14px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto';
        ctx.fillText(subtitle, x + 24, y + 104);

        // Divider
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
        ctx.beginPath();
        ctx.moveTo(x + 24, y + 132);
        ctx.lineTo(x + w - 24, y + 132);
        ctx.stroke();

        // Stat 1
        ctx.fillStyle = '#6b7280';
        ctx.font = '12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto';
        ctx.fillText(stat1Label, x + 24, y + 162);
        ctx.fillStyle = '#34d399';
        ctx.font = 'bold 16px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto';
        ctx.fillText(stat1Val, x + 24, y + 188);

        // Stat 2
        ctx.fillStyle = '#6b7280';
        ctx.font = '12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto';
        ctx.fillText(stat2Label, x + w/2 + 10, y + 162);
        ctx.fillStyle = '#38bdf8';
        ctx.font = 'bold 16px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto';
        ctx.fillText(stat2Val, x + w/2 + 10, y + 188);

        ctx.restore();
      }

      // Top-Left Card (Covers AAPL)
      drawGlassCard(15, 270, 335, 225, 'Format & Codec', '✦', '4K PRORES 422', 'Ultra-HD Cinematic Timeline', 'Color Depth', '10-bit HDR', 'Bitrate', '220 Mbps');

      // Bottom-Left Card (Covers AMZN)
      drawGlassCard(5, 715, 325, 225, 'Precision Editing', '✂', 'FRAME-ACCURATE', 'Beat-Synced Keyframe Cuts', 'Keyframes', '100% Perfect', 'Framerate', '60 FPS');

      // Bottom-Right Card (Covers PLTR)
      drawGlassCard(435, 710, 335, 225, 'Audience Retention', '⚡', 'VIRAL RETENTION', 'Engineered for Watch Time', 'Watch Time', '+85%', 'CTR', '14.8%');

      // Auto-save step01_composite.png
      try {
        fetch('/save-composite', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: 'step01_composite.png', dataUrl: c1.toDataURL('image/png') })
        }).then(r => r.json()).then(console.log).catch(console.error);
      } catch (e) {}
    };

    // Draw Step 02 (Instagram nixaa)
    const img2 = new Image();
    img2.src = '/step02_ref.jpg';
    const imgInsta = new Image();
    imgInsta.src = '/nixaa_instagram.jpg';

    let loaded = 0;
    function checkBoth() {
      loaded++;
      if (loaded === 2) {
        const c2 = document.getElementById('c2');
        const ctx2 = c2.getContext('2d');
        ctx2.drawImage(img2, 0, 0, 774, 1130);

        // Center shifted to (370, 580) and sw: 395, sh: 820 to fully cover old screen
        ctx2.save();
        ctx2.translate(370, 580);
        ctx2.rotate(13.7 * Math.PI / 180);

        const sw = 395;
        const sh = 820;
        const r = 44;
        ctx2.beginPath();
        ctx2.roundRect(-sw/2, -sh/2, sw, sh, r);
        ctx2.fillStyle = '#000';
        ctx2.fill();
        ctx2.clip();

        // Draw Instagram profile image fitted to screen
        ctx2.drawImage(imgInsta, -sw/2, -sh/2, sw, sh);

        // Subtle screen gloss reflection
        const gloss = ctx2.createLinearGradient(-sw/2, -sh/2, sw/2, sh/2);
        gloss.addColorStop(0, 'rgba(255,255,255,0.08)');
        gloss.addColorStop(0.5, 'rgba(255,255,255,0.0)');
        gloss.addColorStop(1, 'rgba(255,255,255,0.04)');
        ctx2.fillStyle = gloss;
        ctx2.fillRect(-sw/2, -sh/2, sw, sh);

        ctx2.restore();

        // Draw Frosted Glass Cards (Replacing connected public, coinbase, webull)
        function drawCard2(x, y, w, h, category, icon, title, subtitle, stat1Label, stat1Val, stat2Label, stat2Val) {
          ctx2.save();
          ctx2.beginPath();
          ctx2.roundRect(x, y, w, h, 24);
          const cardGrad = ctx2.createLinearGradient(x, y, x, y + h);
          cardGrad.addColorStop(0, 'rgba(22, 24, 32, 0.96)');
          cardGrad.addColorStop(1, 'rgba(12, 14, 18, 0.98)');
          ctx2.fillStyle = cardGrad;
          ctx2.fill();
          ctx2.strokeStyle = 'rgba(255, 255, 255, 0.16)';
          ctx2.lineWidth = 1.5;
          ctx2.stroke();

          ctx2.beginPath();
          ctx2.roundRect(x + 2, y + 2, w - 4, h - 4, 22);
          ctx2.strokeStyle = 'rgba(255, 255, 255, 0.05)';
          ctx2.stroke();

          // Category
          ctx2.fillStyle = '#ec4899';
          ctx2.font = 'bold 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto';
          ctx2.fillText(category.toUpperCase(), x + 24, y + 36);

          // Title
          ctx2.fillStyle = '#ffffff';
          ctx2.font = 'bold 22px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto';
          ctx2.fillText(icon + '  ' + title, x + 24, y + 74);

          // Subtitle
          ctx2.fillStyle = '#9ca3af';
          ctx2.font = '14px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto';
          ctx2.fillText(subtitle, x + 24, y + 104);

          // Divider
          ctx2.strokeStyle = 'rgba(255, 255, 255, 0.1)';
          ctx2.beginPath();
          ctx2.moveTo(x + 24, y + 132);
          ctx2.lineTo(x + w - 24, y + 132);
          ctx2.stroke();

          // Stat 1
          ctx2.fillStyle = '#6b7280';
          ctx2.font = '12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto';
          ctx2.fillText(stat1Label, x + 24, y + 162);
          ctx2.fillStyle = '#f43f5e';
          ctx2.font = 'bold 16px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto';
          ctx2.fillText(stat1Val, x + 24, y + 188);

          // Stat 2
          ctx2.fillStyle = '#6b7280';
          ctx2.font = '12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto';
          ctx2.fillText(stat2Label, x + w/2 + 10, y + 162);
          ctx2.fillStyle = '#a855f7';
          ctx2.font = 'bold 16px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto';
          ctx2.fillText(stat2Val, x + w/2 + 10, y + 188);

          ctx2.restore();
        }

        // Top-Left Card (covers public)
        drawCard2(25, 255, 330, 235, 'Creator Identity', '★', '@ft_nixaa', 'Official Portfolio & Works', 'Role', 'Video Editor', 'Platform', 'Instagram');

        // Top-Right Card (covers coinbase)
        drawCard2(440, 340, 330, 230, 'Brand Partner', '⚡', 'BRAND GROWTH', 'High-Converting Visuals', 'Retention', '92%+', 'Avg Reach', '250k+');

        // Bottom Card (covers webull completely)
        drawCard2(250, 745, 380, 280, 'Performance Metrics', '📈', 'AUDIENCE BOOST', 'Cinema-Grade Post Production', 'Engagement', '+180%', 'Watch Time', '88% Avg');

        // Auto-save step02_composite.png
        try {
          fetch('/save-composite', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: 'step02_composite.png', dataUrl: c2.toDataURL('image/png') })
          }).then(r => r.json()).then(console.log).catch(console.error);
        } catch (e) {}
      }
    }
    img2.onload = checkBoth;
    imgInsta.onload = checkBoth;
  </script>
</body>
</html>
